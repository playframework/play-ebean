name: Check

on:
  pull_request:

  push:
    branches:
      - main # Check branch after merge

concurrency:
  # Only run once for latest commit per ref and cancel other (previous) runs.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-code-style:
    name: Code Style
    uses: playframework/.github/.github/workflows/cmd.yml@unblock-repo_scala_sbt_org
    with:
      cmd: sbt validateCode

  check-binary-compatibility:
    name: Binary Compatibility
    uses: playframework/.github/.github/workflows/binary-check.yml@unblock-repo_scala_sbt_org

  check-docs:
    name: Docs
    uses: playframework/.github/.github/workflows/cmd.yml@unblock-repo_scala_sbt_org
    with:
      java: 25, 21, 17
      # Symbolic lanes resolve to exact versions in project/Dependencies.scala.
      scala: 2.13.x, 3.3.x, 3.9.x, 3.next
      cmd: cd docs && sbt -Dscala.version=$MATRIX_SCALA validateCode

  tests:
    name: Tests
    needs:
      - "check-code-style"
      - "check-binary-compatibility"
      - "check-docs"
    uses: playframework/.github/.github/workflows/cmd.yml@unblock-repo_scala_sbt_org
    with:
      java: 25, 21, 17
      # Symbolic lanes resolve to exact versions in project/Dependencies.scala.
      scala: 2.13.x, 3.3.x, 3.9.x, 3.next
      cmd: >-
        sbt --server -Dscala.version=$MATRIX_SCALA testFull

  scripted-tests:
    name: Scripted tests
    needs:
      - "check-code-style"
      - "check-binary-compatibility"
      - "check-docs"
    strategy:
      matrix:
        java:
          - 25
          - 21
          - 17
        plugin_scala:
          - 2.12.x
          - 3.x
        app_scala:
          - 2.13.x
          - 3.3.x
          - 3.9.x
          - 3.next
    uses: playframework/.github/.github/workflows/cmd.yml@unblock-repo_scala_sbt_org
    with:
      java: ${{ matrix.java }}
      cmd: >-
        sbt -Dscripted.scala.version=${{ matrix.app_scala }} "
          +core/publishLocal;
          ++ ${{ matrix.plugin_scala }};
          show scriptedSbt;
          show scriptedLaunchOpts;
          plugin/scripted;
        "

  finish:
    name: Finish
    if: github.event_name == 'pull_request'
    needs: # Should be last
      - "tests"
      - "scripted-tests"
    uses: playframework/.github/.github/workflows/rtm.yml@unblock-repo_scala_sbt_org
