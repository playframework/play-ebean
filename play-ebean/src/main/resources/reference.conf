play {
  modules {
    enabled += "play.db.ebean.EbeanModule"
  }

  ebean {
    # The key for ebean config
    config = "ebean"

    # The name of the default ebean datasource
    defaultDatasource = "default"

    # Whether to generate the evolutions scripts of the Ebean servers (in dev and test mode). Can be
    # overridden for single Ebean servers, see `db` below.
    generateEvolutionsScripts = true

    # Settings of single Ebean servers, keyed by the name of the Ebean server:
    # - readOnlyDatasource: the Play database the Ebean server should use for its read-only queries
    #   (e.g. a read replica). For example, `db.default.readOnlyDatasource = "replica"` makes the
    #   default Ebean server run queries outside of transactions against the `replica` database.
    # - generateEvolutionsScripts: whether to generate the evolutions script of the Ebean server,
    #   overriding the global generateEvolutionsScripts setting above.
    db {}
  }
}
