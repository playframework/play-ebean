play {
  modules {
    enabled += "play.db.ebean.EbeanModule"
  }

  ebean {
    # The key for ebean config
    config = "ebean"

    # The name of the default ebean datasource
    defaultDatasource = "default"

    # The key to control the generation of the Evolutions scripts
    generateEvolutionsScripts = true

    # Maps Ebean servers to the Play databases their read-only queries should use (e.g. a read
    # replica). For example, `default = "replica"` makes the default Ebean server run queries
    # outside of transactions against the `replica` database.
    readOnlyDatasources {}
  }
}
